package:
  name: seerr
  # renovate: datasource=github-releases depName=seerr-team/seerr
  version: 3.5.1
  epoch: 3
  description: Media request manager for Jellyfin, Plex, Emby, Radarr, and Sonarr
  copyright:
    - license: MIT
  options:
    no-depends: true

environment:
  environment:
    NEXT_TELEMETRY_DISABLED: "1"
    # Build native addons against the installed Node headers. node-gyp cannot extract
    # downloaded headers in the build sandbox (fchown EPERM).
    npm_config_nodedir: /usr
  contents:
    repositories:
      - &wolfi-repository https://packages.wolfi.dev/os
    keyring:
      - &wolfi-keyring https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - libuv-dev
      - node-gyp
      - nodejs-22
      - npm
      - pnpm=10.33.1-r0
      - py3.14-setuptools
      - python-3.14

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/seerr-team/seerr
      tag: v${{package.version}}

  # Security pins written by `just remediate seerr`; reviewed in a pull request.
  - uses: eudaldgr-labs/bump
    with:
      language: js
      deps: |-
        @humanfs/node@0.16.7@0.16.8
        bn.js@4.12.2@4.12.3
        brace-expansion@1.1.12@1.1.21
        brace-expansion@5.0.4@5.0.12
        fast-uri@3.1.0@3.1.9
        follow-redirects@1.16.0@1.16.2
        form-data@4.0.5@4.0.6
        handlebars@4.7.8@4.7.10
        linkify-it@5.0.0@5.0.2
        nanoid@3.3.12@3.3.18
        nanoid@5.1.11@5.1.16
        picomatch@2.3.1@2.3.2
        postcss-selector-parser@6.1.2@6.1.5
        postcss@8.5.12@8.5.23
        proxy-addr@2.0.7@2.0.8
        source-map-js@1.2.1@1.2.2
        svgo@3.3.3@3.3.5
        tar@7.5.13@7.5.21
        ua-parser-js@2.0.9@2.0.10
        underscore@1.13.7@1.13.8
        yaml@1.10.2@1.10.3

  - runs: |
      mkdir -p /home/build/.home
      rm -rf package
      mkdir -p package

      cp -a package.json pnpm-lock.yaml .npmrc bin package/

  - working-directory: package
    environment:
      HOME: /home/build/.home
      CI: "true"
    runs: |
      pnpm install --prod --frozen-lockfile

  - environment:
      HOME: /home/build/.home
      CI: "true"
      CYPRESS_INSTALL_BINARY: "0"
      COMMIT_TAG: "v${{package.version}}"
    runs: |
      pnpm install --frozen-lockfile
      pnpm build

      rm -rf .next/cache

  - runs: |
      mkdir -p "${{targets.destdir}}/opt/seerr"

      cp -a \
        .next \
        dist \
        next.config.ts \
        package.json \
        public \
        seerr-api.yml \
        "${{targets.destdir}}/opt/seerr/"
      cp -a package/node_modules "${{targets.destdir}}/opt/seerr/"

      printf '{"commitTag":"v%s"}\n' "${{package.version}}" \
        > "${{targets.destdir}}/opt/seerr/committag.json"

      rm -rf /home/build/.home package

  - uses: eudaldgr-labs/prune
    with:
      paths: /opt/seerr
      remove-empty-directories: "true"

update:
  enabled: true
  github:
    identifier: seerr-team/seerr
    use-tag: true
    strip-prefix: v

test:
  environment:
    contents:
      repositories:
        - *wolfi-repository
      keyring:
        - *wolfi-keyring
      packages:
        - busybox
        - nodejs-22
        - ${{package.name}}=${{package.full-version}}
  pipeline:
    - name: Basic Seerr package test
      runs: |
        test -f /opt/seerr/dist/index.js
        test -f /opt/seerr/package.json
        node -e "require('node:inspector'); require('/opt/seerr/node_modules/sqlite3'); require('/opt/seerr/node_modules/sharp'); const pkg = require('/opt/seerr/package.json'); if (pkg.version !== '${{package.version}}') process.exit(1)"
