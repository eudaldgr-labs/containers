contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - libcrypto3
    - libssl3
    - tzdata
    - eudaldgr-labs-valkey

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: "65532"

entrypoint:
  command: /usr/bin/entrypoint

work-dir: /

environment:
  HOME: /valkey/var
  PATH: /usr/bin:/bin
  TZ: UTC

volumes:
  - /valkey/etc
  - /valkey/var

paths:
  - path: /valkey
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /valkey/etc
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /valkey/run
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /valkey/var
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

annotations:
  org.opencontainers.image.title: "valkey"
  org.opencontainers.image.description: "Hardened Valkey image built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/eudaldgr-labs/containers"
  org.opencontainers.image.source: "https://github.com/eudaldgr-labs/containers/tree/main/valkey"
  org.opencontainers.image.licenses: "BSD-3-Clause"

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin
