name: Melange build
description: Build and test with the same pinned tools as local Just recipes
inputs:
  package-name:
    description: Package directory name
    required: true
  arch:
    description: Target architecture
    required: true
  event-name:
    description: Workflow event name
    required: true
  signing-key-secret:
    description: Private signing key for protected branches
    default: ""
  signing-key-pub-secret:
    description: Public signing key for protected branches
    default: ""
runs:
  using: composite
  steps:
    - name: Install helper dependencies
      shell: bash
      run: just setup
    - name: Download ephemeral signing key
      if: inputs.event-name == 'pull_request'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: melange-ephemeral-key
    - name: Setup signing key
      if: inputs.event-name != 'pull_request'
      shell: bash
      env:
        PRIVATE_KEY: ${{ inputs.signing-key-secret }}
        PUBLIC_KEY: ${{ inputs.signing-key-pub-secret }}
      run: |
        set -euo pipefail
        test -n "$PRIVATE_KEY" && test -n "$PUBLIC_KEY"
        printf '%s\n' "$PRIVATE_KEY" > melange.rsa
        printf '%s\n' "$PUBLIC_KEY" > melange.rsa.pub
        chmod 600 melange.rsa
    - name: Download required packages and rebuild index
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PACKAGE: ${{ inputs.package-name }}
        ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        chmod 600 melange.rsa
        .venv/bin/python -m scripts.packages download "$PACKAGE" melange "$ARCH"
        just index "$ARCH"
    - name: Build and test package
      shell: bash
      env:
        PACKAGE: ${{ inputs.package-name }}
        ARCH: ${{ inputs.arch }}
      run: |
        just melange "$PACKAGE" "$ARCH"
        just melangecheck "$PACKAGE" "$ARCH"
    - name: Stage own APKs
      shell: bash
      env:
        PACKAGE: ${{ inputs.package-name }}
        ARCH: ${{ inputs.arch }}
      run: .venv/bin/python -m scripts.packages stage "$PACKAGE" "$ARCH"
    - name: Upload packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: packages-${{ inputs.package-name }}-${{ inputs.arch }}
        path: .artifacts/
        if-no-files-found: error
        retention-days: 1
