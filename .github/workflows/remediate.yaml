---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Remediate Dependencies

# Proposes security pins for recipes with an `eudaldgr-labs/bump` step and opens one
# bot pull request per recipe. Builds never resolve fixes; they apply the committed pins.

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Recipe to plan; empty plans every opted-in recipe"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: remediate
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: just python
      - id: list
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          just setup
          if [[ -n "$PACKAGE" ]]; then
            .venv/bin/python -c 'import json, sys; from scripts.remediate import recipe; assert recipe(sys.argv[1])[1], "not opted in"; print("packages=" + json.dumps([sys.argv[1]]))' "$PACKAGE" >> "$GITHUB_OUTPUT"
          else
            .venv/bin/python -m scripts.remediate opted
          fi

  plan:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      # Matrix outputs collapse to the last writer, so the push job checks each artifact.
      # Runs dependency resolvers from upstream sources, so it never holds a write token.
      - uses: eudaldgr-labs/.github/actions/pr-regenerate@105a3ffd82d51f2bfed42583eb24f77b18eac44e # pr-regenerate-v1.0.0
        with:
          ref: ${{ github.sha }}
          run: just setup && just remediate "${{ matrix.name }}" x86_64
          paths: |
            ${{ matrix.name }}/melange.yaml
          artifact: remediation-${{ matrix.name }}
          extra-files: |
            out/remediation/${{ matrix.name }}/pr.md

  push:
    needs: [discover, plan]
    if: ${{ !cancelled() && needs.discover.outputs.packages != '[]' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: remediation-${{ matrix.name }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq "[.artifacts[] | select(.name == \"$NAME\")] | length")
          echo "exists=$([[ "$count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.artifact.outputs.exists == 'true'
        uses: eudaldgr-labs/.github/actions/pr-regenerate/push@105a3ffd82d51f2bfed42583eb24f77b18eac44e # pr-regenerate-v1.0.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          artifact: remediation-${{ matrix.name }}
          paths: |
            ${{ matrix.name }}/melange.yaml
          ref: ${{ github.sha }}
          branch: remediation/${{ matrix.name }}
          force: "true"
          commit-message: "fix(${{ matrix.name }}): remediate vulnerable dependencies"
          pr-title: "fix(${{ matrix.name }}): remediate vulnerable dependencies"
          pr-body-file: pr.md
