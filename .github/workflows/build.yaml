---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Hardened Images

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!.assets/**"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_HOST: ghcr.io
  OWNER: ${{ github.repository_owner }}
  REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MAX_DEP_TIER: 2

jobs:
  ##############################################################################
  # DISCOVER PACKAGES AND IMAGES TO BUILD (outputs for downstream jobs)        #
  ##############################################################################
  discover:
    runs-on: ubuntu-26.04
    outputs:
      base_packages: ${{ steps.set.outputs.base_packages }}
      deps_tier_1: ${{ steps.set.outputs.deps_tier_1 }}
      deps_tier_2: ${{ steps.set.outputs.deps_tier_2 }}
      apko_images: ${{ steps.set.outputs.apko_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: just python

      - name: Set up validation tools
        run: mise install actionlint shellcheck zizmor

      - name: Check automation
        run: |
          just setup
          just lint

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - id: set
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: .venv/bin/python -m scripts.packages discover

  ##############################################################################
  # GENERATE EPHEMERAL SIGNING KEY (PR only - secrets not available for forks) #
  ##############################################################################
  keygen:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: just python

      - name: Generate ephemeral signing key
        run: just keygen

      - name: Upload signing key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: melange-ephemeral-key
          path: |
            melange.rsa
            melange.rsa.pub
          retention-days: 1

  ##############################################################################
  # TIER 1: BUILD BASE MELANGE PACKAGES (no internal dependencies)             #
  ##############################################################################
  melange-build-base:
    needs: [discover, keygen]
    if: ${{ !cancelled() && needs.discover.result == 'success' && (needs.keygen.result == 'success' || needs.keygen.result == 'skipped') && needs.discover.outputs.base_packages != '[]' && needs.discover.outputs.base_packages != '[""]' }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.discover.outputs.base_packages) }}
        arch: [x86_64, aarch64]

    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: just python

      - name: Build package
        uses: ./.github/actions/melange-build
        with:
          package-name: ${{ matrix.name }}
          arch: ${{ matrix.arch }}
          event-name: ${{ github.event_name }}
          signing-key-secret: ${{ secrets.MELANGE_SIGNING_KEY }}
          signing-key-pub-secret: ${{ secrets.MELANGE_SIGNING_KEY_PUB }}

  ##############################################################################
  # TIER 2+: BUILD DEPENDENT MELANGE PACKAGES (tiered by dependency depth)     #
  ##############################################################################
  melange-build-deps-tier-1:
    needs: [discover, keygen, melange-build-base]
    if: >-
      !cancelled()
      && needs.discover.result == 'success'
      && (needs.keygen.result == 'success' || needs.keygen.result == 'skipped')
      && needs.discover.outputs.deps_tier_1 != '[]'
      && needs.discover.outputs.deps_tier_1 != '[""]'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.discover.outputs.deps_tier_1) }}
        arch: [x86_64, aarch64]

    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: just python

      - name: Build package
        uses: ./.github/actions/melange-build
        with:
          package-name: ${{ matrix.name }}
          arch: ${{ matrix.arch }}
          event-name: ${{ github.event_name }}
          signing-key-secret: ${{ secrets.MELANGE_SIGNING_KEY }}
          signing-key-pub-secret: ${{ secrets.MELANGE_SIGNING_KEY_PUB }}

  melange-build-deps-tier-2:
    needs: [discover, keygen, melange-build-base, melange-build-deps-tier-1]
    if: >-
      !cancelled()
      && needs.discover.result == 'success'
      && (needs.keygen.result == 'success' || needs.keygen.result == 'skipped')
      && needs.discover.outputs.deps_tier_2 != '[]'
      && needs.discover.outputs.deps_tier_2 != '[""]'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.discover.outputs.deps_tier_2) }}
        arch: [x86_64, aarch64]

    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: just python

      - name: Build package
        uses: ./.github/actions/melange-build
        with:
          package-name: ${{ matrix.name }}
          arch: ${{ matrix.arch }}
          event-name: ${{ github.event_name }}
          signing-key-secret: ${{ secrets.MELANGE_SIGNING_KEY }}
          signing-key-pub-secret: ${{ secrets.MELANGE_SIGNING_KEY_PUB }}

  ##############################################################################
  # BUILD IMAGES: check local APKs regardless of sibling failures              #
  ##############################################################################
  build-images:
    needs:
      [discover, keygen, melange-build-base, melange-build-deps-tier-1, melange-build-deps-tier-2]
    if: >-
      !cancelled() && needs.discover.result == 'success'
      && (needs.keygen.result == 'success' || needs.keygen.result == 'skipped')
      && needs.discover.outputs.apko_images != '[]'
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.discover.outputs.apko_images) }}
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: just python
      - name: Install helper dependencies
        run: just setup
      - name: Download ephemeral signing key
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: melange-ephemeral-key
      - name: Set up signing key
        if: github.event_name != 'pull_request'
        env:
          PRIVATE_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ secrets.MELANGE_SIGNING_KEY_PUB }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY" && test -n "$PUBLIC_KEY"
          printf '%s\n' "$PRIVATE_KEY" > melange.rsa
          printf '%s\n' "$PUBLIC_KEY" > melange.rsa.pub
          chmod 600 melange.rsa
      - name: Download required packages and rebuild index
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod 600 melange.rsa
          .venv/bin/python -m scripts.packages download "$IMAGE_NAME" apko "$ARCH"
          just index "$ARCH"
      - name: Build image once
        env:
          IMAGE_NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: TAG="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" just apko "$IMAGE_NAME" "$ARCH"
      - name: Resolve release metadata
        id: metadata
        env:
          IMAGE_NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: .venv/bin/python -m scripts.release prepare "$IMAGE_NAME" "$ARCH"
      - name: Scan final image
        env:
          IMAGE_NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          mise install trivy
          just scan "$IMAGE_NAME" "$ARCH"
      - name: Upload Grype SARIF
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles(format('grype-{0}-{1}.sarif', matrix.name, matrix.arch)) != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: grype-${{ matrix.name }}-${{ matrix.arch }}.sarif
          category: grype-${{ matrix.name }}-${{ matrix.arch }}
      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles(format('trivy-{0}-{1}.sarif', matrix.name, matrix.arch)) != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.name }}-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.name }}-${{ matrix.arch }}
      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image candidate
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          REPOSITORY: ${{ steps.metadata.outputs.repository }}
        run: .venv/bin/python -m scripts.release push "$IMAGE_NAME" "$ARCH"
      - name: Add report provenance
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' && hashFiles(format('cve-report-{0}-{1}.json', matrix.name, matrix.arch)) != '' }}
        env:
          IMAGE_NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: .venv/bin/python -m scripts.release report "$IMAGE_NAME" "$ARCH"
      - name: Upload scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cve-report-${{ matrix.name }}-${{ matrix.arch }}
          path: |
            cve-report-${{ matrix.name }}-${{ matrix.arch }}.json
            grype-${{ matrix.name }}-${{ matrix.arch }}.sarif
            trivy-${{ matrix.name }}-${{ matrix.arch }}.sarif
            out/${{ matrix.name }}-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload release candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}-${{ matrix.arch }}
          path: .artifacts/release-${{ matrix.name }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 1

  publish-images:
    needs: [discover, build-images]
    if: >-
      !cancelled() && github.event_name != 'pull_request'
      && needs.discover.result == 'success' && needs.discover.outputs.apko_images != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.discover.outputs.apko_images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: just python
      - run: just setup
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download candidates for this image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ matrix.name }}-*
          path: .artifacts
          merge-multiple: true
      - name: Assemble, sign and promote tested digests
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: .venv/bin/python -m scripts.release publish "$IMAGE_NAME"
      - name: Upload published digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: .artifacts/published-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 90

  ##############################################################################
  # SUMMARY                                                                    #
  ##############################################################################
  summary:
    # Required by the `main` ruleset (eudaldgr-labs/.github safe-settings).
    name: Build Success
    needs:
      [
        discover,
        melange-build-base,
        melange-build-deps-tier-1,
        melange-build-deps-tier-2,
        build-images,
        publish-images,
        keygen,
      ]
    runs-on: ubuntu-26.04
    if: always()
    permissions: {}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo '| Job | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert results["discover"]["result"] == "success", "Discovery failed"
          for name, job in results.items():
              assert job["result"] in {"success", "skipped"}, f"{name}: {job["result"]}"
          outputs = results["discover"]["outputs"]
          for key in ["base_packages", *[f"deps_tier_{i}" for i in range(1, 3)], "apko_images"]:
              job = "melange-build-base" if key == "base_packages" else "build-images" if key == "apko_images" else "melange-build-deps-tier-" + key.rsplit("_", 1)[1]
              if json.loads(outputs[key]):
                  assert results[job]["result"] == "success", f"Expected {job} was skipped"
          if json.loads(outputs["apko_images"]) and os.environ["GITHUB_EVENT_NAME"] != "pull_request":
              assert results["publish-images"]["result"] == "success", "Publication was skipped"
          PY
