contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - libevent
    - libseccomp
    - openssl
    - xz
    - zlib
    - zstd
    - tzdata
    - tor

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: "65532"

work-dir: /

entrypoint:
  command: /usr/bin/entrypoint

volumes:
  - /tor/etc
  - /tor/var

paths:
  - path: /tor
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /tor/etc
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /tor/var
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /tor/run
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

annotations:
  org.opencontainers.image.title: "tor"
  org.opencontainers.image.description: "Hardened Tor image built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/eudaldgr-labs/containers"
  org.opencontainers.image.source: "https://github.com/eudaldgr-labs/containers/tree/main/tor"
  org.opencontainers.image.licenses: "BSD-3-Clause"

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin
