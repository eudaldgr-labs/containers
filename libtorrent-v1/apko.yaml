contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - libtorrent-v1

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: "65532"

annotations:
  org.opencontainers.image.title: "libtorrent-v1"
  org.opencontainers.image.description: "Hardened libtorrent-rasterbar 1.2 static library built on Wolfi"
  org.opencontainers.image.url: "https://github.com/eudaldgr-labs/containers"
  org.opencontainers.image.source: "https://github.com/eudaldgr-labs/containers/tree/main/libtorrent-v1"
  org.opencontainers.image.licenses: "BSD-3-Clause"

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin
