package:
  name: ghost
  version: 6.73.0 # renovate: datasource=npm depName=ghost
  epoch: 1
  description: Professional publishing platform
  copyright:
    - license: MIT
  options:
    no-depends: true

environment:
  environment:
    NODE_ENV: production
  contents:
    repositories:
      - &wolfi-repository https://packages.wolfi.dev/os
    keyring:
      - &wolfi-keyring https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - corepack
      - node-gyp
      - nodejs-22
      - npm
      - py3.14-setuptools
      - python-3.14

pipeline:
  - runs: |
      mkdir -p package
      npm pack "ghost@${{package.version}}" --silent
      tar -xzf "ghost-${{package.version}}.tgz" -C package --strip-components=1
      rm -f "ghost-${{package.version}}.tgz"

  - working-directory: package
    runs: |
      export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      corepack enable
      pnpm install \
        --ignore-scripts \
        --prod \
        --frozen-lockfile

  - working-directory: package/node_modules/better-sqlite3
    runs: |
      npm run install

  - runs: |
      mkdir -p "${{targets.destdir}}/opt/ghost"
      cp -a package/. "${{targets.destdir}}/opt/ghost/"

  - uses: eudaldgr-labs/prune
    with:
      paths: /opt/ghost

  - runs: |
      mkdir -p "${{targets.destdir}}/${{package.name}}/etc"
      mkdir -p "${{targets.destdir}}/${{package.name}}/log"
      mkdir -p "${{targets.destdir}}/${{package.name}}/var"
      cp -a "${{targets.destdir}}/opt/ghost/content/." "${{targets.destdir}}/${{package.name}}/var/"
      rm -rf "${{targets.destdir}}/${{package.name}}/var/logs"
      rm -rf "${{targets.destdir}}/opt/ghost/content" "${{targets.destdir}}/opt/ghost/log"
      ln -sf /${{package.name}}/log "${{targets.destdir}}/${{package.name}}/var/logs"
      ln -sf /${{package.name}}/etc/config.production.json "${{targets.destdir}}/opt/ghost/config.production.json"
      ln -sf /${{package.name}}/var "${{targets.destdir}}/opt/ghost/content"
      ln -sf /${{package.name}}/log "${{targets.destdir}}/opt/ghost/log"

update:
  enabled: false
  exclude-reason: Package updates rely on npm tarballs, checksum refresh, and native module pruning handled by Renovate.

test:
  environment:
    contents:
      repositories:
        - *wolfi-repository
      keyring:
        - *wolfi-keyring
      packages:
        - busybox
        - nodejs-22-minimal
        - ${{package.name}}=${{package.full-version}}
  pipeline:
    - name: Ghost package layout test
      runs: |
        test -f /opt/ghost/index.js
        test -d /ghost/var/themes
        test -L /ghost/var/logs
        test -L /opt/ghost/config.production.json
        test -L /opt/ghost/content
        test -L /opt/ghost/log
        node -e "require('/opt/ghost/node_modules/better-sqlite3')(':memory:').close(); require('module').createRequire(require.resolve('/opt/ghost/node_modules/@tryghost/image-transform'))('sharp'); require('/opt/ghost/package.json')"
