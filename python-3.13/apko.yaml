contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - tzdata
    - python-3.13

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: "65532"

entrypoint:
  command: /usr/bin/python3.13

work-dir: /

environment:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: "python-3.13"
  org.opencontainers.image.description: "Hardened Python 3.13 runtime built on Wolfi with daily CVE patches"
  org.opencontainers.image.url: "https://github.com/eudaldgr-labs/containers"
  org.opencontainers.image.source: "https://github.com/eudaldgr-labs/containers/tree/main/python-3.13"
  org.opencontainers.image.licenses: "Python-2.0"

archs:
  - x86_64
  - aarch64

layering:
  strategy: origin
